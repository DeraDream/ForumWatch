# ForumWatch Docker 部署示例 —— `docker compose up -d`
#
# 首次启动会写入默认配置到 /data/config.json;更省事的路径是直接打开
# http://localhost:8787 在网页里配好关键词与 Telegram(与桌面版同一套界面)。
# 数据(配置/去重集/命中/日志)全部在命名卷 fw-data 里,升级换镜像不丢。

services:
  forumwatch:
    image: yforward7/forumwatch:latest
    container_name: forumwatch
    restart: unless-stopped
    ports:
      - "8787:8787" # 管理界面(宿主侧可改,容器侧保持 8787 或同步 FW_WEB_PORT)
    environment:
      TZ: Asia/Shanghai # 日报/命中按本地日分桶,务必设置时区
      # 公网可达时必须设置访问令牌(浏览器首次访问会提示输入):
      # FW_WEB_TOKEN: change-me-to-a-strong-secret
      # 也可用环境变量快速注入 Telegram 凭据(不落盘,优先级高于配置文件):
      # NSM_BOT_TOKEN: "123456:ABC..."
      # NSM_CHAT_ID: "10086"
    volumes:
      - fw-data:/data
    # 仅供 WUD 精确识别本服务：追踪 latest 的镜像摘要变化，并只允许其 Compose 更新器操作本服务。
    labels:
      wud.watch.digest: "true"
      wud.tag.include: "^latest$"
      wud.trigger.dockercompose.local.enabled: "true"

  # WUD 是维护中的 Docker 镜像更新器：它独占 Docker Socket，ForumWatch 本身绝不接触 Socket。
  # 每 6 小时检查 yforward7/forumwatch:latest；发现新摘要时拉取、重建本服务，并在健康检查失败时回滚。
  # 管理页面仅绑定 127.0.0.1:3000，远程查看请经 SSH 隧道，切勿直接暴露公网。
  wud:
    image: getwud/wud:9.7.0
    container_name: forumwatch-wud
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Shanghai
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_WATCHER_LOCAL_CRON: "0 */6 * * *"
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_FILE: /compose/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_AUTO: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_ROLLBACK: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_LOCAL_ROLLBACKWINDOW: "300000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose 更新器需要写入此文件以固定已验证的镜像摘要，并保留 .back 回退文件。
      - ./:/compose
      - wud-store:/store
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  fw-data:
  wud-store:
